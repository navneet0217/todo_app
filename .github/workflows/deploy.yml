
name: Todo App CI/CD

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build backend image
        run: docker build -t ghcr.io/${{ github.repository_owner }}/todo-backend:latest ./backend

      - name: Push backend image
        run: docker push ghcr.io/${{ github.repository_owner }}/todo-backend:latest

      - name: Build frontend image
        run: docker build -t ghcr.io/${{ github.repository_owner }}/todo-frontend:latest ./frontend

      - name: Push frontend image
        run: docker push ghcr.io/${{ github.repository_owner }}/todo-frontend:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/todo_app
            sudo docker compose pull
            sudo docker compose up -d

